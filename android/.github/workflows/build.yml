# Unit tests + debug and release APKs on every push to main / pull request; a v* tag also
# publishes a GitHub release with the unsigned release APK. Needs gradle/android-common.gradle
# (task printVersion, versioned APK names).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', '.agentsroom/**', '.claude/**']
  pull_request:
    paths-ignore: ['**.md', '.agentsroom/**', '.claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # gradlew committed from Windows has no executable bit.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble APKs
        run: ./gradlew --no-daemon printVersion assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
