# Project-wide Gradle settings. https://developer.android.com/build/optimize-your-build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Only true if the app uses AndroidX libraries (androidx.*). Framework-only apps keep false.
android.useAndroidX=false
# Each library's R class contains only its own resources (smaller, faster builds).
android.nonTransitiveRClass=true

kotlin.code.style=official
